name: Draft PDF

on:
  push:
    branches: [main]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - uses: actions/checkout@v4
      - uses: openjournals/joss-paper-draft@main
        with:
          paper-path: paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
